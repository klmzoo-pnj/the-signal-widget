
name: THE SIGNAL - Daily Widget

on:
  workflow_dispatch:

  schedule:
    - cron: "45 7 * * *"
      timezone: "Europe/Paris"

# Empêche deux publications simultanées.
concurrency:
  group: the-signal-pages
  cancel-in-progress: false

jobs:

  # ====================================
  # 1. GÉNÉRATION DE LA VEILLE
  # ====================================

  generate:
    name: Generate THE SIGNAL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install openai

      - name: Generate daily intelligence brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate.py

      - name: Validate generated files
        run: |
          test -s docs/signal.json
          test -s docs/index.html
          python -m json.tool docs/signal.json > /dev/null
          echo "THE SIGNAL files validated."

      - name: Save daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/signal.json

          if ! git diff --cached --quiet; then
            git commit -m "Update THE SIGNAL daily brief"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # ====================================
  # 2. PUBLICATION DU SITE
  # ====================================

  deploy:
    name: Publish THE SIGNAL
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
